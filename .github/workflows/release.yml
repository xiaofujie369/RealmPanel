name: Test and publish prebuilt images
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests/test_backend.py tests/test_auth.py tests/test_traffic.py -q
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: bash -n install.sh scripts/rmpctl scripts/update.sh && bash install.sh --check
  installer-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13', 'rockylinux:9', 'almalinux:9', 'fedora:43', 'alpine:3.23']
    steps:
      - uses: actions/checkout@v4
      - name: Check OS and install real Docker and Compose packages
        env:
          OS_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" "$OS_IMAGE" sh -c '
            command -v bash >/dev/null || apk add --no-cache bash
            bash -c "source /src/install.sh; detect_system; install_dependencies; install_docker_packages; docker --version; docker compose version; command -v mkswap; command -v swapon"
          '
  swap-setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create and verify a real 1 GiB swap file on disposable runner
        run: |
          sudo bash -c '
            source ./install.sh
            swapoff -a
            ensure_swap
            test "$(stat -c %s /var/lib/realm-panel/swapfile)" = 1073741824
            test "$(stat -c %a /var/lib/realm-panel/swapfile)" = 600
            swapon --show=NAME --noheadings | grep -Fx /var/lib/realm-panel/swapfile
            ensure_swap
            test "$(grep -Fc /var/lib/realm-panel/swapfile /etc/fstab)" = 1
          '
  build:
    needs: [test, installer-compatibility, swap-setup]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Realm release
        run: python3 scripts/download-realm.py --arch '${{ matrix.arch }}'
      - name: Build on GitHub, never on the VPS
        run: |
          export RMP_VERSION=$(cat VERSION)
          docker compose -f docker-compose.yml -f docker-compose.build.yml build
          docker run --rm realm-panel-core:$RMP_VERSION /usr/local/bin/realm --version
          mkdir -p dist
          docker save realm-panel-web:$RMP_VERSION realm-panel-core:$RMP_VERSION | gzip -1 > dist/realm-panel-images-${{ matrix.arch }}.tar.gz
      - name: Real TCP and UDP integration test
        run: sudo --preserve-env=GITHUB_ACTIONS bash scripts/ci-live.sh
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.arch }}
          path: dist/*.tar.gz
          compression-level: 0
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: dist
          merge-multiple: true
      - name: Package source, checksums and installer
        run: |
          VERSION=$(cat VERSION)
          test "v$VERSION" = "$GITHUB_REF_NAME"
          git archive --format=tar.gz --prefix=realm-panel/ -o dist/realm-panel.tar.gz HEAD
          cp install.sh dist/install.sh
          cp scripts/install-local.sh dist/install-local.sh
          printf '{"version":"%s","realm_version":"2.9.3","architectures":["amd64","arm64"]}\n' "$VERSION" > dist/release.json
          cd dist
          sha256sum *.tar.gz *.sh release.json > SHA256SUMS
      - name: Publish prerelease for fresh installer acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "RealmPanel $GITHUB_REF_NAME" --generate-notes
  install-release:
    needs: [publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Fresh installation using public precompiled release
        run: |
          VERSION=$(cat VERSION)
          curl -fL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/install.sh" -o /tmp/rmp-install.sh
          sudo env RMP_VERSION="$VERSION" bash /tmp/rmp-install.sh --yes
          sudo python3 /opt/realm-panel/scripts/healthcheck.py
          sudo docker run --rm --network host -v /opt/realm-panel:/opt/realm-panel -v /root/realm-panel-install-info.txt:/root/realm-panel-install-info.txt:ro "realm-panel-web:$VERSION" python /opt/realm-panel/tests/live_acceptance.py
      - name: Verify precompiled update and preserved data
        run: sudo rmpctl update "$(cat VERSION)"
      - if: always()
        run: sudo bash -c 'cd /opt/realm-panel && docker compose down' || true
  promote:
    needs: [install-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Promote only after real installer acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
